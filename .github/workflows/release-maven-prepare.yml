name: "R: Maven Prepare"
run-name: "R: Maven Prepare ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'POM version without (-SNAPSHOT)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

jobs:
  maven-prepare:
    name: Maven Prepare ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Commit and Push Credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Maven release prepare
        run: |
          ./.ci/release-maven-prepare.sh ${{ inputs.version }}

      - name: Save Maven release descriptor
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-${{ inputs.version }}
          path: release.properties
          if-no-files-found: error
          retention-days: 1

      - name: Push release commits and tag
        run: |
          git push origin main --tags
